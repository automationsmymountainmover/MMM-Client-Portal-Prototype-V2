#mmm-portal .mp-public-header{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:35px}

#mmm-portal .mp-public h1{margin:12px 0}#mmm-portal .mp-public-intro{color:var(--muted);margin-bottom:25px}
#mmm-portal .mp-public .mp-form{margin-top:25px}#mmm-portal .mp-public .mp-check{margin-top:20px}
#mmm-portal .mp-public .mp-check input{width:18px}#mmm-portal .mp-honeypot{display:none}
@media(max-width:600px){#mmm-portal .mp-share{grid-template-columns:1fr;padding:20px}#mmm-portal .mp-qr{order:-1}#mmm-portal .mp-account-grid{grid-template-columns:1fr;gap:18px}#mmm-portal .mp-public{padding:24px 16px}#mmm-portal .mp-form-footer{flex-wrap:wrap}#mmm-portal .mp-button{white-space:normal}}

#mmm-portal .mp-brand{display:flex;min-width:0;gap:12px;align-items:center;padding:0}
#mmm-portal .mp-brand img{display:block;object-fit:contain;max-width:100%;height:auto}
#mmm-portal .mp-brand-sidebar img{width:52px;height:52px;flex-shrink:0}
#mmm-portal .mp-brand-caption{font-family:Montserrat,Inter,sans-serif;font-size:13px;font-weight:600;letter-spacing:.02em;line-height:1.4}
#mmm-portal .mp-brand-light,#mmm-portal .mp-brand-dark{flex-direction:column;align-items:flex-start;gap:12px;width:340px;max-width:100%}
#mmm-portal .mp-brand-light img,#mmm-portal .mp-brand-dark img{width:100%;height:auto}
#mmm-portal .mp-brand-light .mp-brand-caption{color:var(--deep)}
#mmm-portal .mp-brand-dark .mp-brand-caption{color:#c1e0e5}
#mmm-portal .mp-demo-panel{padding:20px 24px;background:#fff9f1;border-bottom:1px solid #ead9c4;font-size:13px}
#mmm-portal .mp-demo-panel h2{font-size:17px;margin-bottom:8px}
#mmm-portal .mp-demo-panel p{margin:8px 0 14px;max-width:950px}
#mmm-portal .mp-demo-panel label{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#mmm-portal .mp-demo-panel select{padding:8px;border-radius:6px;border:1px solid #cbdade;background:white}
#mmm-portal .mp-quickgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin:0 0 25px}
#mmm-portal .mp-quick{display:flex;align-items:flex-start;flex-direction:column;gap:12px;border:1px solid var(--line);background:white;border-radius:12px;padding:21px;text-align:left;color:var(--deep)}
#mmm-portal .mp-quick:hover{background:#edf7f8;border-color:var(--teal)}
#mmm-portal .mp-quick>span:first-child{background:#e9f4f6;border-radius:9px;padding:10px;display:flex}
#mmm-portal .mp-quick strong{font-size:15px}#mmm-portal .mp-quick small{font-size:12px;color:var(--muted);line-height:1.5}
#mmm-portal .mp-conversation{margin-top:22px}
#mmm-portal .mp-message{padding:18px;border:1px solid #e2eaed;border-radius:10px;margin-bottom:14px;background:#fff}
#mmm-portal .mp-message.staff{background:#eef7f8;border-color:#d9ecef}
#mmm-portal .mp-message.pending{border-style:dashed;background:#fffbf2}
#mmm-portal .mp-message-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;font-size:13px;margin-bottom:8px;flex-wrap:wrap}
#mmm-portal .mp-message-head small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
#mmm-portal .mp-message p{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
#mmm-portal .mp-message time{font-size:11px;color:var(--muted)}
#mmm-portal .mp-files{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px}
#mmm-portal .mp-file{display:inline-flex;align-items:center;gap:7px;max-width:100%;border:1px solid #d6e4e7;padding:8px 10px;border-radius:7px;background:white;font-size:12px;color:var(--deep);text-decoration:none;overflow-wrap:anywhere}
#mmm-portal .mp-upload{border:1px dashed #9cbdc4;border-radius:10px;padding:15px;background:#f8fbfc}
#mmm-portal .mp-upload input{border:0;padding:5px 0;background:transparent}
#mmm-portal .mp-file-label{margin-top:8px;color:var(--muted);font-size:12px;overflow-wrap:anywhere}
#mmm-portal .mp-service-notice{margin-bottom:20px}
#mmm-portal .mp-badge.pending{background:#fff1d9;color:#805511}
#mmm-portal .mp-badge.failed{background:#fcece7;color:#973e29}
#mmm-portal .mp-badge.paid{background:#e7f3ec;color:#286444}
#mmm-portal .mp-referral-layout{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(220px,1fr);gap:22px;align-items:start}
#mmm-portal .mp-how{padding:24px;background:#edf7f8;border:1px solid #d6e9ed;border-radius:12px}
#mmm-portal .mp-how h2{font-size:18px;margin-bottom:20px}
#mmm-portal .mp-how p{font-size:14px;color:#456970;margin:8px 0 22px}
#mmm-portal .mp-section-gap{margin-top:22px}
#mmm-portal .mp-invoice-total{font-family:Montserrat,sans-serif;font-size:34px;font-weight:700;color:var(--deep);margin:8px 0 24px}
#mmm-portal .mp-topbar .mp-button{margin-left:8px}
#mmm-portal .mp-content:focus{outline:none}
@media(max-width:1100px){#mmm-portal .mp-quickgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:780px){#mmm-portal .mp-referral-layout{grid-template-columns:1fr}#mmm-portal .mp-how{order:-1}#mmm-portal .mp-how p{margin-bottom:10px}#mmm-portal .mp-demo-panel{padding:18px}}
@media(max-width:520px){#mmm-portal .mp-quick{padding:17px}#mmm-portal .mp-quickgrid{gap:10px}#mmm-portal .mp-user{gap:5px}#mmm-portal .mp-topbar .mp-button{padding:6px 8px;font-size:12px}#mmm-portal .mp-message{padding:14px}#mmm-portal .mp-kv{flex-wrap:wrap}#mmm-portal .mp-kv strong{text-align:left}#mmm-portal .mp-account-grid{grid-template-columns:1fr}}

function brand(variant='sidebar'){
 const compact=variant==='sidebar';
 const src=compact?brandAssets.markWhite:variant==='light'?brandAssets.wordmarkTeal:brandAssets.wordmarkWhite;
 return `<div class="mp-brand mp-brand-${variant}"><img src="${src}" alt="My Mountain Mover" width="${compact?372:1989}" height="372"><span class="mp-brand-caption">Client portal</span></div>`;
}

const stamp=()=>new Date().toISOString();

 const s=snapshot();

}

async function readAttachments(form){
 const files=Array.from(form.querySelector('input[type=file]')?.files||[]);
 if(files.length>FILE_COUNT)throw new Error('Please select no more than 3 files.');
 for(const f of files){const ext=f.name.split('.').pop().toLowerCase();if(!FILE_TYPES[ext]||f.size>FILE_LIMIT||f.size===0)throw new Error('Choose non-empty PDF, PNG, JPG or TXT files up to 5 MB each.');if(f.type&&f.type!==FILE_TYPES[ext])throw new Error('The file type does not match its extension. Please choose another file.');}
 return Promise.all(files.map(f=>new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=()=>reject(new Error('A file could not be read. Please select it again.'));reader.onload=()=>resolve({id:newId('file'),name:f.name,size:f.size,mime:FILE_TYPES[f.name.split('.').pop().toLowerCase()],data:reader.result});reader.readAsDataURL(f);}))); 
}

async function processQueue(){
 if(!state.online||processing)return;processing=true;const before=snapshot();
 try{
  for(const q of queue.filter(q=>q.status==='Pending')){
   const u=users.find(u=>u.id===q.actor.uid),t=tickets.find(t=>t.id===(q.kind==='comment'?q.caseId:q.recordId));
   const r=q.kind==='referral'?referrals.find(r=>r.id===q.recordId):q.kind==='comment'?t?.comments.find(c=>c.id===q.recordId):t;
   let error=!eligible(u)||u.accountId!==q.actor.accountId?'Access changed before submission. Contact your MMM team.':null;
   if(q.kind==='comment'&&(!t||t.accountId!==q.actor.accountId||isClosed(t)))error='The Case closed or became unavailable before the comment could be sent.';
   if(q.kind==='ticket'&&t?.vaIds.some(id=>!vas.some(v=>v.id===id&&v.accountId===q.actor.accountId&&ALLOWED_VA_STATUSES.includes(v.status))))error='A selected VA is no longer eligible. Contact your MMM team.';
   if(!r)error='The saved submission could not be found.';
   q.status=error?'Failed':'Confirmed';q.error=error;q.completedAt=stamp();
   if(r){r.delivery=q.status;r.error=error;if(q.kind==='ticket'&&!error){r.ref=r.ref.replace(/^P-/,'MMM-');r.history.push({label:'Case created',at:stamp()});}}
   addLog(q.kind+' processed',q.recordId,q.status,q.actor);
  }
  await persist();
 }catch{restore(before);toast('The demo could not save the result. Your submission remains pending.');}
 finally{processing=false;}
}

 if(b.dataset.vaSupport){go('newticket',{vaId:b.dataset.vaSupport});return;}
 if(b.dataset.billingQuestion){const r=ownInvoices().find(x=>x.id===b.dataset.billingQuestion);if(r)go('newticket',{category:'Account or Billing Question',subject:'Question about invoice '+r.Name,description:'Invoice: '+r.Name+'\n\nMy question: '});return;}
 if(a==='older-invoice'){go('newticket',{category:'Account or Billing Question',subject:'Request a copy of an older invoice',description:'Please email a copy of the following invoice(s):\n\nInvoice number or service period: '});return;}
 if(b.dataset.filter){state.filter=b.dataset.filter;render();return;}
 if(b.dataset.file)downloadAttachment(b.dataset.file);
});
root.addEventListener('change',e=>{
 if(busy||processing)return;
 if(e.target.id==='mp-demo-user'){state.userId=e.target.value;state.stage='in';state.detailId=null;state.authStep=null;go('home');}
 if(e.target.id==='mp-demo-eligibility'){const a=account(me().accountId);a.Account_Status__c=e.target.value==='inactive'?'Inactive':'Active';a.Type=e.target.value==='nonclient'?'Prospect':'Client';render();}
 if(e.target.id==='mp-category'||e.target.id==='mp-staffing')updateTicketFields();
 if(['mp-ticket-files','mp-comment-files'].includes(e.target.id)){const list=$('#'+e.target.id+'-list');list.textContent=Array.from(e.target.files).map(f=>f.name+' ('+Math.ceil(f.size/1024)+' KB)').join(', ')||'No files selected.';}
});
root.addEventListener('input',e=>{if(e.target.id==='mp-search'){const pos=e.target.selectionStart;state.search=e.target.value;ticketsView();refreshIcons();$('#mp-search').focus();$('#mp-search').setSelectionRange(pos,pos);}});
root.addEventListener('submit',async e=>{
 e.preventDefault();if(busy||processing)return;
 if(e.target.id==='mp-login-form'){state.sentEmail=$('#mp-login-email').value.trim();state.authStep='sent';render();return;}
 if(!canUse())return;
 if(e.target.id==='mp-ticket-form')await submitTicket(e.target);
 if(e.target.id==='mp-referral-form')await submitReferral(e.target);
 if(e.target.id==='mp-comment-form')await submitComment(e.target);
});
async function initialize(){
 seedConversations();
 try{
  db=await new Promise((resolve,reject)=>{const r=indexedDB.open('mmm-client-portal-mvp-demo-v2',1);r.onupgradeneeded=()=>r.result.createObjectStore('preview');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.onblocked=()=>reject(new Error('Storage blocked'));});
  const saved=await new Promise((resolve,reject)=>{const tx=db.transaction('preview','readonly');const r=tx.objectStore('preview').get('state');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});
  if(saved?.version===2)restore(saved);
  storageMode='device';await persist();
 }catch{db=null;storageMode='session';}
 await processQueue();render();
}
initialize();

})();
</script>
